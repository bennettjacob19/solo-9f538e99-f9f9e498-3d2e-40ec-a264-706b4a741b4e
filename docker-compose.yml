services:
  pipeline:
    build: .
    image: firmware-pipeline:latest
    container_name: firmware-pipeline
    ports:
      - "8000:8000"
    environment:
      # 全局最多两步并行（默认值，显式声明便于审计）
      PIPELINE_MAX_PARALLEL: "2"
      PIPELINE_MAX_STEPS: "12"
      PIPELINE_DATA_DIR: "/data"
    volumes:
      # 挂载工作目录：所有命令在此目录下按构建隔离执行，重启后数据保留
      - pipeline-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pipeline-data:
